<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营情报站</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#25392f;font-family:system-ui,-apple-system,sans-serif}header{background:#173e32;color:#fff;padding:48px max(6vw,20px)}small{letter-spacing:3px;color:#b6ccbf}h1{font-size:clamp(32px,6vw,56px);margin:16px 0}header p{color:#d5e4db;line-height:1.8}main{max-width:1100px;margin:auto;padding:30px 20px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}button,input{font:inherit;padding:12px 18px;border:1px solid #cbd2c8;border-radius:8px;background:white;color:#25392f}button{cursor:pointer}button.active{background:#173e32;color:white}input{flex:1;min-width:200px}article{background:white;padding:26px;border-radius:14px;margin:18px 0;box-shadow:0 3px 20px #183d3108}h2{font-size:25px}h3{font-size:20px;margin:12px 0}p{line-height:1.85}a{color:#23724e}label,.meta{font-size:13px;color:#65796b}.tag{font-size:12px;background:#e9f2e9;padding:5px 9px;border-radius:5px}.item{border-top:1px solid #e7eae3;padding:22px 0}.item:last-child{padding-bottom:0}.item img{width:100%;max-height:320px;object-fit:contain;background:#f5f5f1;border-radius:8px}footer{padding:30px;text-align:center;color:#718073;font-size:13px}</style><header><small>DAILY OPERATIONS BRIEF</small><h1>运营情报站<span style="color:#c5df94">.</span></h1><p>商业化 · 电商 · 本地生活<br>把行业变化，变成你的面试观点。</p></header><main><nav><button class="active" data-cat="全部">全部</button><button data-cat="商业化">商业化</button><button data-cat="电商">电商</button><button data-cat="本地生活">本地生活</button><input id="search" placeholder="搜索平台、事件或关键词" aria-label="搜索日报"><input type="date" id="date" aria-label="按日期筛选"></nav><div class="meta" id="count"></div><div id="reports">正在加载归档…</div></main><footer>日报归档 · 每日更新 · 事实有来源，观点可讨论</footer><script>let data=[],cat='全部';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>String(s||'').startsWith('https://')?esc(s):'';function render(){const q=document.querySelector('#search').value.toLowerCase(),d=document.querySelector('#date').value;let n=0;document.querySelector('#reports').innerHTML=data.filter(r=>!d||r.date===d).map(r=>{const items=r.items.filter(i=>(cat==='全部'||i.category===cat)&&JSON.stringify(i).toLowerCase().includes(q));if(!items.length)return '';n++;return '<article><div class="meta">'+esc(r.date)+' · '+esc(r.period||'每日简报')+'</div><h2>'+esc(r.title)+'</h2>'+items.map(i=>'<section class="item"><span class="tag">'+esc(i.category)+'</span><h3>'+esc(i.title)+'</h3>'+(safe(i.image)?'<img loading="lazy" src="'+safe(i.image)+'" alt="'+esc(i.title)+'"><div class="meta">图片来源：'+esc(i.imageSource||'原文')+'</div>':'')+'<p>'+esc(i.summary)+'</p><p><b>运营观察：</b>'+esc(i.insight)+'</p><p><b>面试思考：</b>'+esc(i.question)+'</p>'+(safe(i.url)?'<a href="'+safe(i.url)+'" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>':'')+'</section>').join('')+(r.exercise?'<p><b>今日练习：</b>'+esc(r.exercise)+'</p>':'')+'</article>'}).join('')||'<article>暂无符合条件的日报。试试其他日期或关键词。</article>';document.querySelector('#count').textContent=n+' 期归档 · 最新内容优先'}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#search').oninput=render;document.querySelector('#date').oninput=render;fetch('./reports.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{data=x;render()}).catch(()=>document.querySelector('#reports').textContent='暂时无法加载，请稍后刷新。');</script></html>
