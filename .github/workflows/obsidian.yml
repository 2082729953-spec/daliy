name: Sync public Obsidian notes
on:
  push:
    branches: [main]
    paths:
      - reports.json
      - scripts/sync_obsidian.py
      - .github/workflows/obsidian.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-obsidian-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Generate and validate notes
        run: python3 scripts/sync_obsidian.py
      - name: Commit generated public notes
        run: |
          if [ -n "$(git status --porcelain -- vault/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- vault/
            git commit -m 'Sync public Obsidian notes from daily reports'
            git push origin HEAD:main
          fi
